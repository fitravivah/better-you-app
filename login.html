<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalori — Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: oklch(0.975 0 0);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.955 0 0);
  --ink: oklch(0.16 0 0);
  --ink-2: oklch(0.35 0 0);
  --muted: oklch(0.55 0 0);
  --line: oklch(0.86 0 0);
  --line-soft: oklch(0.92 0 0);
  --clay: oklch(0.18 0 0);
  --clay-soft: oklch(0.88 0 0);
  --plum: oklch(0.22 0 0);
  --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
}
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: "Open Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size: 14.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
* { box-sizing: border-box; }
button { font-family: inherit; cursor: pointer; }

.display { font-family: "Anton", "Impact", system-ui, sans-serif; font-weight: 400; letter-spacing: 0.02em; text-transform: uppercase; }
.headline { font-family: "Anton", "Impact", system-ui, sans-serif; font-weight: 400; letter-spacing: 0.01em; text-transform: uppercase; }
.script { font-family: "Open Sans", system-ui, sans-serif; font-weight: 600; font-style: italic; }
.mono { font-family: "Open Sans", system-ui, sans-serif; font-weight: 600; }

#root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/components.jsx"></script>
<script type="text/babel" src="src/login.jsx"></script>
<script type="text/babel">
function handleLogin(u) {
  const session = {
    name: u.name || (u.email ? u.email.split("@")[0] : "Marcos"),
    email: u.email || "kamu@email.com",
    bio: "Konsistensi kecil setiap hari.",
    age: 28,
    gender: "Laki-laki",
    heightCm: 175,
    weightKg: 72,
    targetWeightKg: 68,
    activity: "moderate",
    goal: "fatloss",
    startDate: new Date().toISOString().slice(0, 10),
  };
  try { localStorage.setItem("kalori.user", JSON.stringify(session)); } catch (e) {}
  window.location.href = "index.html";
}
ReactDOM.createRoot(document.getElementById("root")).render(<Login onLogin={handleLogin} />);
</script>
</body>
</html>
